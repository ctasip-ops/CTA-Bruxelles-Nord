<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue & Horaires SNCB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow-y: auto;
      padding: 2rem 0;
      cursor: pointer;
    }
    .container {
      width: 90%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .logo {
      max-width: 300px;
      max-height: 300px;
      object-fit: contain;
    }
    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      padding: 3rem 2.5rem;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    h2 {
      font-size: 2.2rem;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    h1 {
      font-size: 3.8rem;
      color: #38bdf8;
      font-weight: 700;
      line-height: 1.2;
      word-wrap: break-word;
    }
    .standby-msg {
      font-size: 2.5rem;
      color: #64748b;
      font-weight: 300;
    }

    /* Styles pour le tableau des trains (Police agrandie) */
    .train-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      text-align: left;
      font-size: 2rem;
    }
    .train-table th {
      color: #94a3b8;
      font-weight: 400;
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .train-table td {
      padding: 1.2rem 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .train-table tr:last-child td {
      border-bottom: none;
    }
    .train-time {
      font-weight: 700;
      color: #38bdf8;
      width: 20%;
    }
    .train-delay {
      color: #f87171;
      font-size: 1.6rem;
      font-weight: 600;
      margin-left: 8px;
    }
    .train-dest {
      font-weight: 600;
      width: 48%;
    }
    .train-type {
      color: #94a3b8;
      font-size: 1.5rem;
      width: 17%;
    }
    .train-platform {
      text-align: center;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-radius: 10px;
      padding: 0.3rem 0.8rem;
      display: inline-block;
      min-width: 55px;
      font-size: 1.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.jpg" alt="Logo" class="logo" id="site-logo" onerror="this.style.display='none';">

    <!-- CONTENEUR ÉCRAN 1 : AGENDA / BIENVENUE -->
    <div id="screen-welcome" style="width: 100%; display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="card" id="standby-card">
        <p class="standby-msg">Bienvenue</p>
      </div>
    </div>

    <!-- CONTENEUR ÉCRAN 2 : HORAIRES DES TRAINS (Bruxelles-Nord) -->
    <div id="screen-trains" class="card" style="display: none;">
      <h2>Prochains départs — Bruxelles-Nord</h2>
      <table class="train-table">
        <thead>
          <tr>
            <th>Heure</th>
            <th>Destination</th>
            <th>Train</th>
            <th style="text-align: right;">Quai</th>
          </tr>
        </thead>
        <tbody id="train-list">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8; font-size: 1.8rem;">Chargement des horaires...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
